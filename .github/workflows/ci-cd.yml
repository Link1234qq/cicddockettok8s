# Full CI/CD pipeline: Docker app → infra → deploy to K8s per env

name: CI CD

on:
  push:
    branches:
      - develop
      - 'feature/*'
  pull_request:
    types: [opened, synchronize, reopened, closed]

env:
  APP_NAME: ${{ vars.APP_NAME }}
  CONTAINER_REGISTRY: ${{ vars.CONTAINER_REGISTRY }}

jobs:
  # --- CI: always run (build + test, lint, security scan) ---
  call-ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [call-ci]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run linters
        run: npm run lint

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    needs: [call-ci]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Dependency vulnerability scan
        run: npm run audit || true

  # --- CD: only on merge to main (pull_request merged) — build image then sequential promotion with infra before each deploy ---
  call-docker-build:
    name: Docker build
    uses: ./.github/workflows/docker-build.yml
    needs: [call-ci, lint, security-scan]
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && success()
    with:
      app-name: ${{ env.APP_NAME }}
      container-registry: ${{ env.CONTAINER_REGISTRY }}
    secrets: inherit

  call-infra-dev:
    name: Infra dev
    uses: ./.github/workflows/infra.yml
    needs: [call-docker-build]
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && success()
    with:
      env: dev
    secrets: inherit

  call-deploy-dev:
    name: Deploy dev
    uses: ./.github/workflows/deploy.yml
    needs: [call-infra-dev]
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && success()
    with:
      env: dev
    secrets: inherit

  call-infra-stage:
    name: Infra stage
    uses: ./.github/workflows/infra.yml
    needs: [call-deploy-dev]
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && success()
    with:
      env: stage
    secrets: inherit

  call-deploy-stage:
    name: Deploy stage
    uses: ./.github/workflows/deploy.yml
    needs: [call-infra-stage]
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && success()
    with:
      env: stage
    secrets: inherit

  call-infra-prod:
    name: Infra prod
    uses: ./.github/workflows/infra.yml
    needs: [call-deploy-stage]
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && success()
    with:
      env: prod
    secrets: inherit

  call-deploy-prod:
    name: Deploy prod
    uses: ./.github/workflows/deploy.yml
    needs: [call-infra-prod]
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && success()
    with:
      env: prod
    secrets: inherit
